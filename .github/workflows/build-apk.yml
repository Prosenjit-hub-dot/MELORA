package com.melora.app;

import android.app.Activity;
import android.os.Bundle;
import android.graphics.Color;
import android.graphics.Typeface;
import android.graphics.drawable.GradientDrawable;
import android.view.Gravity;
import android.view.View;
import android.view.ViewGroup;
import android.widget.*;

import java.util.ArrayList;
import java.util.List;

public class MainActivity extends Activity {

    private LinearLayout root;
    private LinearLayout content;
    private TextView title;
    private TextView nowPlayingTitle;
    private TextView nowPlayingArtist;
    private Button playButton;

    private boolean playing = false;

    private final int BG = Color.rgb(9, 9, 11);
    private final int CARD = Color.rgb(24, 24, 27);
    private final int CARD2 = Color.rgb(39, 39, 42);
    private final int WHITE = Color.WHITE;
    private final int GRAY = Color.rgb(161, 161, 170);
    private final int PURPLE = Color.rgb(168, 85, 247);
    private final int PINK = Color.rgb(236, 72, 153);

    private final List<Song> songs = new ArrayList<>();

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        createSongs();
        buildApp();
        showHome();
    }

    private void createSongs() {

        songs.add(new Song(
                "Midnight Dreams",
                "MELORA",
                "Electronic"
        ));

        songs.add(new Song(
                "Neon Hearts",
                "Luna",
                "Pop"
        ));

        songs.add(new Song(
                "Lost In Echo",
                "Aria",
                "Ambient"
        ));

        songs.add(new Song(
                "Afterglow",
                "Nova",
                "Chill"
        ));

        songs.add(new Song(
                "Ocean Lights",
                "MELORA",
                "Electronic"
        ));
    }

    private void buildApp() {

        root = new LinearLayout(this);
        root.setOrientation(LinearLayout.VERTICAL);
        root.setBackgroundColor(BG);

        setContentView(root);

        createTopBar();

        content = new LinearLayout(this);
        content.setOrientation(LinearLayout.VERTICAL);

        ScrollView scrollView = new ScrollView(this);
        scrollView.setFillViewport(true);
        scrollView.addView(content);

        root.addView(
                scrollView,
                new LinearLayout.LayoutParams(
                        ViewGroup.LayoutParams.MATCH_PARENT,
                        0,
                        1
                )
        );

        createBottomNavigation();
    }

    private void createTopBar() {

        LinearLayout bar = new LinearLayout(this);
        bar.setGravity(Gravity.CENTER_VERTICAL);
        bar.setPadding(22, 22, 22, 12);

        TextView logo = text(
                "MELORA",
                24,
                WHITE,
                true
        );

        LinearLayout.LayoutParams logoParams =
                new LinearLayout.LayoutParams(
                        0,
                        ViewGroup.LayoutParams.WRAP_CONTENT,
                        1
                );

        bar.addView(logo, logoParams);

        TextView search = text(
                "⌕",
                30,
                WHITE,
                false
        );

        search.setGravity(Gravity.CENTER);
        search.setOnClickListener(v -> showSearch());

        bar.addView(
                search,
                new LinearLayout.LayoutParams(55, 55)
        );

        root.addView(bar);
    }

    private void createBottomNavigation() {

        LinearLayout nav = new LinearLayout(this);
        nav.setOrientation(LinearLayout.HORIZONTAL);
        nav.setGravity(Gravity.CENTER);
        nav.setPadding(8, 8, 8, 10);
        nav.setBackgroundColor(Color.rgb(15, 15, 18));

        addNavButton(nav, "⌂", "Home", v -> showHome());
        addNavButton(nav, "♫", "Library", v -> showLibrary());
        addNavButton(nav, "♡", "Liked", v -> showLiked());
        addNavButton(nav, "☰", "Playlists", v -> showPlaylists());

        root.addView(
                nav,
                new LinearLayout.LayoutParams(
                        ViewGroup.LayoutParams.MATCH_PARENT,
                        72
                )
        );
    }

    private void addNavButton(
            LinearLayout nav,
            String icon,
            String name,
            View.OnClickListener listener
    ) {

        LinearLayout item = new LinearLayout(this);
        item.setOrientation(LinearLayout.VERTICAL);
        item.setGravity(Gravity.CENTER);

        TextView iconView = text(
                icon,
                23,
                WHITE,
                false
        );

        TextView label = text(
                name,
                11,
                GRAY,
                false
        );

        item.addView(iconView);
        item.addView(label);

        item.setOnClickListener(listener);

        nav.addView(
                item,
                new LinearLayout.LayoutParams(
                        0,
                        ViewGroup.LayoutParams.MATCH_PARENT,
                        1
                )
        );
    }

    private void showHome() {

        clearContent();

        title = text(
                "Good evening",
                30,
                WHITE,
                true
        );

        content.addView(
                title,
                marginParams(24, 10, 24, 18)
        );

        TextView subtitle = text(
                "Find your sound.",
                16,
                GRAY,
                false
        );

        content.addView(
                subtitle,
                marginParams(24, 0, 24, 25)
        );

        addSectionTitle("MELORA MIX");

        LinearLayout mix = card();

        TextView mixTitle = text(
                "Your personalized mix",
                21,
                WHITE,
                true
        );

        TextView mixDescription = text(
                "A fresh collection made for your mood.",
                14,
                GRAY,
                false
        );

        Button playMix = roundedButton("▶  PLAY MIX");

        playMix.setOnClickListener(v -> playSong(songs.get(0)));

        mix.addView(
                mixTitle,
                marginParams(20, 18, 20, 5)
        );

        mix.addView(
                mixDescription,
                marginParams(20, 0, 20, 18)
        );

        mix.addView(
                playMix,
                marginParams(20, 0, 20, 18)
        );

        content.addView(
                mix,
                marginParams(20, 0, 20, 25)
        );

        addSectionTitle("QUICK PICKS");

        for (int i = 0; i < 3; i++) {
            addSongCard(songs.get(i));
        }

        addSectionTitle("YOUR LIBRARY");

        LinearLayout shortcuts = new LinearLayout(this);
        shortcuts.setPadding(18, 0, 18, 20);

        addShortcut(shortcuts, "♡", "Liked", v -> showLiked());
        addShortcut(shortcuts, "♫", "Songs", v -> showLibrary());
        addShortcut(shortcuts, "☰", "Playlists", v -> showPlaylists());

        content.addView(shortcuts);
    }

    private void showLibrary() {

        clearContent();

        addPageHeader(
                "Your Library",
                "Everything you've saved."
        );

        addSectionTitle("RECENTLY PLAYED");

        for (Song song : songs) {
            addSongCard(song);
        }
    }

    private void showLiked() {

        clearContent();

        addPageHeader(
                "Liked Songs",
                "Your favorite music."
        );

        addSongCard(songs.get(1));
        addSongCard(songs.get(3));
    }

    private void showPlaylists() {

        clearContent();

        addPageHeader(
                "Playlists",
                "Organize your music."
        );

        LinearLayout create = card();

        TextView icon = text(
                "+",
                35,
                PURPLE,
                true
        );

        TextView name = text(
                "Create playlist",
                18,
                WHITE,
                true
        );

        create.addView(
                icon,
                marginParams(20, 15, 20, 5)
        );

        create.addView(
                name,
                marginParams(20, 0, 20, 18)
        );

        create.setOnClickListener(
                v -> Toast.makeText(
                        this,
                        "Playlist creation coming soon",
                        Toast.LENGTH_SHORT
                ).show()
        );

        content.addView(
                create,
                marginParams(20, 0, 20, 20)
        );

        addSectionTitle("YOUR PLAYLISTS");

        addPlaylist("Late Night", "12 songs");
        addPlaylist("Chill Mode", "18 songs");
        addPlaylist("Favorites", "24 songs");
    }

    private void showSearch() {

        clearContent();

        addPageHeader(
                "Search",
                "Find your next favorite song."
        );

        EditText input = new EditText(this);

        input.setHint("Search artists, songs...");
        input.setHintTextColor(GRAY);
        input.setTextColor(WHITE);
        input.setTextSize(16);
        input.setSingleLine(true);
        input.setPadding(18, 0, 18, 0);

        GradientDrawable bg = roundedBackground(
                CARD2,
                18
        );

        input.setBackground(bg);

        content.addView(
                input,
                marginParams(20, 5, 20, 15)
        );

        Button searchButton = roundedButton("SEARCH");

        content.addView(
                searchButton,
                marginParams(20, 0, 20, 25)
        );

        LinearLayout results = new LinearLayout(this);
        results.setOrientation(LinearLayout.VERTICAL);

        content.addView(results);

        searchButton.setOnClickListener(
                v -> performSearch(
                        input.getText().toString(),
                        results
                )
        );
    }

    private void performSearch(
            String query,
            LinearLayout results
    ) {

        results.removeAllViews();

        if (query.trim().isEmpty()) {

            TextView empty = text(
                    "Type something to search.",
                    15,
                    GRAY,
                    false
            );

            results.addView(
                    empty,
                    marginParams(20, 10, 20, 10)
            );

            return;
        }

        boolean found = false;

        for (Song song : songs) {

            if (
                    song.title.toLowerCase().contains(
                            query.toLowerCase()
                    )
                    ||
                    song.artist.toLowerCase().contains(
                            query.toLowerCase()
                    )
                    ||
                    song.genre.toLowerCase().contains(
                            query.toLowerCase()
                    )
            ) {

                found = true;

                addSongCardTo(
                        song,
                        results
                );
            }
        }

        if (!found) {

            TextView empty = text(
                    "No results found.",
                    15,
                    GRAY,
                    false
            );

            results.addView(
                    empty,
                    marginParams(20, 10, 20, 10)
            );
        }
    }

    private void addSongCard(Song song) {

        addSongCardTo(
                song,
                content
        );
    }

    private void addSongCardTo(
            Song song,
            LinearLayout parent
    ) {

        LinearLayout card = new LinearLayout(this);
        card.setOrientation(LinearLayout.HORIZONTAL);
        card.setGravity(Gravity.CENTER_VERTICAL);
        card.setPadding(14, 12, 14, 12);

        card.setBackground(
                roundedBackground(
                        CARD,
                        18
                )
        );

        TextView artwork = text(
                "♫",
                28,
                WHITE,
                true
        );

        artwork.setGravity(Gravity.CENTER);

        GradientDrawable artworkBg =
                roundedBackground(
                        PURPLE,
                        16
                );

        artwork.setBackground(artworkBg);

        card.addView(
                artwork,
                new LinearLayout.LayoutParams(58, 58)
        );

        LinearLayout details = new LinearLayout(this);
        details.setOrientation(LinearLayout.VERTICAL);

        TextView songTitle = text(
                song.title,
                17,
                WHITE,
                true
        );

        TextView artist = text(
                song.artist + " • " + song.genre,
                13,
                GRAY,
                false
        );

        details.addView(songTitle);
        details.addView(artist);

        LinearLayout.LayoutParams detailParams =
                new LinearLayout.LayoutParams(
                        0,
                        ViewGroup.LayoutParams.WRAP_CONTENT,
                        1
                );

        detailParams.setMargins(
                15,
                0,
                8,
                0
        );

        card.addView(
                details,
                detailParams
        );

        TextView play = text(
                "▶",
                21,
                WHITE,
                true
        );

        play.setGravity(Gravity.CENTER);

        card.addView(
                play,
                new LinearLayout.LayoutParams(
                        50,
                        50
                )
        );

        View.OnClickListener listener =
                v -> playSong(song);

        card.setOnClickListener(listener);
        play.setOnClickListener(listener);

        parent.addView(
                card,
                marginParams(20, 0, 20, 12)
        );
    }

    private void addPlaylist(
            String name,
            String count
    ) {

        LinearLayout item = card();

        TextView icon = text(
                "♫",
                28,
                PURPLE,
                true
        );

        TextView title = text(
                name,
                17,
                WHITE,
                true
        );

        TextView songs = text(
                count,
                13,
                GRAY,
                false
        );

        item.addView(
                icon,
                marginParams(20, 15, 20, 5)
        );

        item.addView(
                title,
                marginParams(20, 0, 20, 3)
        );

        item.addView(
                songs,
                marginParams(20, 0, 20, 15)
        );

        content.addView(
                item,
                marginParams(20, 0, 20, 12)
        );
    }

    private void addShortcut(
            LinearLayout parent,
            String icon,
            String name,
            View.OnClickListener listener
    ) {

        LinearLayout item = new LinearLayout(this);
        item.setOrientation(LinearLayout.VERTICAL);
        item.setGravity(Gravity.CENTER);
        item.setPadding(5, 10, 5, 10);

        TextView iconView = text(
                icon,
                27,
                WHITE,
                true
        );

        TextView label = text(
                name,
                12,
                GRAY,
                false
        );

        item.addView(iconView);
        item.addView(label);

        item.setOnClickListener(listener);

        parent.addView(
                item,
                new LinearLayout.LayoutParams(
                        0,
                        90,
                        1
                )
        );
    }

    private void addPageHeader(
            String heading,
            String description
    ) {

        content.addView(
                text(
                        heading,
                        30,
                        WHITE,
                        true
                ),
                marginParams(20, 15, 20, 5)
        );

        content.addView(
                text(
                        description,
                        15,
                        GRAY,
                        false
                ),
                marginParams(20, 0, 20, 25)
        );
    }

    private void addSectionTitle(
            String value
    ) {

        TextView section = text(
                value,
                13,
                GRAY,
                true
        );

        section.setLetterSpacing(0.12f);

        content.addView(
                section,
                marginParams(20, 10, 20, 12)
        );
    }

    private LinearLayout card() {

        LinearLayout layout = new LinearLayout(this);

        layout.setOrientation(
                LinearLayout.VERTICAL
        );

        layout.setBackground(
                roundedBackground(
                        CARD,
                        20
                )
        );

        return layout;
    }

    private Button roundedButton(
            String value
    ) {

        Button button = new Button(this);

        button.setText(value);
        button.setTextColor(WHITE);
        button.setTextSize(13);
        button.setTypeface(
                Typeface.DEFAULT,
                Typeface.BOLD
        );

        button.setAllCaps(false);
        button.setPadding(
                22,
                8,
                22,
                8
        );

        button.setBackground(
                roundedBackground(
                        PURPLE,
                        30
                )
        );

        return button;
    }

    private GradientDrawable roundedBackground(
            int color,
            int radius
    ) {

        GradientDrawable drawable =
                new GradientDrawable();

        drawable.setColor(color);
        drawable.setCornerRadius(radius);

        return drawable;
    }

    private TextView text(
            String value,
            float size,
            int color,
            boolean bold
    ) {

        TextView view = new TextView(this);

        view.setText(value);
        view.setTextSize(size);
        view.setTextColor(color);

        if (bold) {
            view.setTypeface(
                    Typeface.DEFAULT,
                    Typeface.BOLD
            );
        }

        return view;
    }

    private LinearLayout.LayoutParams marginParams(
            int left,
            int top,
            int right,
            int bottom
    ) {

        LinearLayout.LayoutParams params =
                new LinearLayout.LayoutParams(
                        ViewGroup.LayoutParams.MATCH_PARENT,
                        ViewGroup.LayoutParams.WRAP_CONTENT
                );

        params.setMargins(
                left,
                top,
                right,
                bottom
        );

        return params;
    }

    private void clearContent() {

        if (content != null) {
            content.removeAllViews();
        }
    }

    private void playSong(Song song) {

        playing = !playing;

        if (playing) {

            Toast.makeText(
                    this,
                    "Playing " + song.title,
                    Toast.LENGTH_SHORT
            ).show();

            showNowPlaying(song);

        } else {

            Toast.makeText(
                    this,
                    "Paused",
