        name="AppTheme"
        parent="android:style/Theme.Material.NoActionBar">

        <item name="android:fontFamily">sans</item>

        <item name="android:windowLightStatusBar">false</item>

        <item name="android:statusBarColor">#09090B</item>

        <item name="android:navigationBarColor">#09090B</item>

        <item name="android:colorAccent">#A855F7</item>

        <item name="android:windowActionModeOverlay">true</item>

    </style>

</resources>
package com.melora.app;

import android.app.Activity;
import android.os.Bundle;
import android.graphics.Color;
import android.graphics.Typeface;
import android.graphics.drawable.GradientDrawable;
import android.view.Gravity;
import android.view.View;
import android.view.ViewGroup;
import android.widget.*;

import java.util.ArrayList;
import java.util.List;

public class MainActivity extends Activity {

    private LinearLayout root;
    private LinearLayout content;

    private TextView nowPlayingTitle;
    private TextView nowPlayingArtist;
    private Button playButton;

    private boolean playing = false;

    private final int BG = Color.rgb(9, 9, 11);
    private final int CARD = Color.rgb(24, 24, 27);
    private final int CARD2 = Color.rgb(39, 39, 42);
    private final int WHITE = Color.WHITE;
    private final int GRAY = Color.rgb(161, 161, 170);
    private final int PURPLE = Color.rgb(168, 85, 247);

    private final List<Song> songs = new ArrayList<>();

    @Override
    protected void onCreate(Bundle savedInstanceState) {

        super.onCreate(savedInstanceState);

        createSongs();

        buildApp();

        showHome();
    }

    private void createSongs() {

        songs.add(
                new Song(
                        "Midnight Dreams",
                        "MELORA",
                        "Electronic"
                )
        );

        songs.add(
                new Song(
                        "Neon Hearts",
                        "Luna",
                        "Pop"
                )
        );

        songs.add(
                new Song(
                        "Lost In Echo",
                        "Aria",
                        "Ambient"
                )
        );

        songs.add(
                new Song(
                        "Afterglow",
                        "Nova",
                        "Chill"
                )
        );

        songs.add(
                new Song(
                        "Ocean Lights",
                        "MELORA",
                        "Electronic"
                )
        );
    }

    private void buildApp() {

        root = new LinearLayout(this);

        root.setOrientation(
                LinearLayout.VERTICAL
        );

        root.setBackgroundColor(BG);

        setContentView(root);

        createTopBar();

        ScrollView scroll = new ScrollView(this);

        scroll.setFillViewport(true);

        content = new LinearLayout(this);

        content.setOrientation(
                LinearLayout.VERTICAL
        );

        scroll.addView(content);

        root.addView(
                scroll,
                new LinearLayout.LayoutParams(
                        ViewGroup.LayoutParams.MATCH_PARENT,
                        0,
                        1
                )
        );

        createBottomNavigation();
    }

    private void createTopBar() {

        LinearLayout bar = new LinearLayout(this);

        bar.setGravity(
                Gravity.CENTER_VERTICAL
        );

        bar.setPadding(
                22,
                18,
                22,
                10
        );

        TextView logo = text(
                "MELORA",
                24,
                WHITE,
                true
        );

        bar.addView(
                logo,
                new LinearLayout.LayoutParams(
                        0,
                        ViewGroup.LayoutParams.WRAP_CONTENT,
                        1
                )
        );

        TextView search = text(
                "⌕",
                32,
                WHITE,
                false
        );

        search.setGravity(Gravity.CENTER);

        search.setOnClickListener(
                v -> showSearch()
        );

        bar.addView(
                search,
                new LinearLayout.LayoutParams(
                        55,
                        55
                )
        );

        root.addView(bar);
    }

    private void createBottomNavigation() {

        LinearLayout nav = new LinearLayout(this);

        nav.setGravity(Gravity.CENTER);

        nav.setPadding(
                5,
                5,
                5,
                8
        );

        nav.setBackgroundColor(
                Color.rgb(15, 15, 18)
        );

        addNav(
                nav,
                "⌂",
                "Home",
                v -> showHome()
        );

        addNav(
                nav,
                "♫",
                "Library",
                v -> showLibrary()
        );

        addNav(
                nav,
                "♡",
                "Liked",
                v -> showLiked()
        );

        addNav(
                nav,
                "☰",
                "Playlists",
                v -> showPlaylists()
        );

        root.addView(
                nav,
                new LinearLayout.LayoutParams(
                        ViewGroup.LayoutParams.MATCH_PARENT,
                        72
                )
        );
    }

    private void addNav(
            LinearLayout nav,
            String icon,
            String name,
            View.OnClickListener listener
    ) {

        LinearLayout item = new LinearLayout(this);

        item.setOrientation(
                LinearLayout.VERTICAL
        );

        item.setGravity(Gravity.CENTER);

        TextView i = text(
                icon,
                23,
                WHITE,
                false
        );

        TextView t = text(
                name,
                11,
                GRAY,
                false
        );

        item.addView(i);
        item.addView(t);

        item.setOnClickListener(listener);

        nav.addView(
                item,
                new LinearLayout.LayoutParams(
                        0,
                        ViewGroup.LayoutParams.MATCH_PARENT,
                        1
                )
        );
    }

    private void showHome() {

        clearContent();

        content.addView(
                text(
                        "Good evening",
                        30,
                        WHITE,
                        true
                ),
                margins(24, 10, 24, 5)
        );

        content.addView(
                text(
                        "Find your sound.",
                        16,
                        GRAY,
                        false
                ),
                margins(24, 0, 24, 25)
        );

        section("MELORA MIX");

        LinearLayout mix = card();

        mix.addView(
                text(
                        "Your personalized mix",
                        21,
                        WHITE,
                        true
                ),
                margins(20, 18, 20, 5)
        );

        mix.addView(
                text(
                        "A fresh collection made for your mood.",
                        14,
                        GRAY,
                        false
                ),
                margins(20, 0, 20, 18)
        );

        Button play = button("▶  PLAY MIX");

        play.setOnClickListener(
                v -> playSong(songs.get(0))
        );

        mix.addView(
                play,
                margins(20, 0, 20, 18)
        );

        content.addView(
                mix,
                margins(20, 0, 20, 25)
        );

        section("QUICK PICKS");

        for (int i = 0; i < 3; i++) {
            songCard(songs.get(i));
        }

        section("YOUR LIBRARY");

        LinearLayout shortcuts = new LinearLayout(this);

        shortcuts.setGravity(Gravity.CENTER);

        addShortcut(
                shortcuts,
                "♡",
                "Liked",
                v -> showLiked()
        );

        addShortcut(
                shortcuts,
                "♫",
                "Songs",
                v -> showLibrary()
        );

        addShortcut(
                shortcuts,
                "☰",
                "Playlists",
                v -> showPlaylists()
        );

        content.addView(shortcuts);
    }

    private void showLibrary() {

        clearContent();

        header(
                "Your Library",
                "Everything you've saved."
        );

        section("RECENTLY PLAYED");

        for (Song song : songs) {
            songCard(song);
        }
    }

    private void showLiked() {

        clearContent();

        header(
                "Liked Songs",
                "Your favorite music."
        );

        songCard(songs.get(1));

        songCard(songs.get(3));
    }

    private void showPlaylists() {

        clearContent();

        header(
                "Playlists",
                "Organize your music."
        );

        playlist(
                "Late Night",
                "12 songs"
        );

        playlist(
                "Chill Mode",
                "18 songs"
        );

        playlist(
                "Favorites",
                "24 songs"
        );
    }

    private void showSearch() {

        clearContent();

        header(
                "Search",
                "Find your next favorite song."
        );

        EditText search = new EditText(this);

        search.setHint(
                "Search songs or artists..."
        );

        search.setHintTextColor(GRAY);

        search.setTextColor(WHITE);

        search.setSingleLine(true);

        search.setTextSize(16);

        search.setPadding(
                18,
                0,
                18,
                0
        );

        search.setBackground(
                rounded(
                        CARD2,
                        18
                )
        );

        content.addView(
                search,
                margins(20, 5, 20, 15)
        );

        Button searchButton =
                button("SEARCH");

        content.addView(
                searchButton,
                margins(20, 0, 20, 20)
        );

        LinearLayout results =
                new LinearLayout(this);

        results.setOrientation(
                LinearLayout.VERTICAL
        );

        content.addView(results);

        searchButton.setOnClickListener(
                v -> searchSongs(
                        search.getText().toString(),
                        results
                )
        );
    }

    private void searchSongs(
            String query,
            LinearLayout results
    ) {

        results.removeAllViews();

        if (query.trim().isEmpty()) {

            results.addView(
                    text(
                            "Type something to search.",
                            15,
                            GRAY,
                            false
                    ),
                    margins(20, 10, 20, 10)
            );

            return;
        }

        boolean found = false;

        for (Song song : songs) {

            String q =
                    query.toLowerCase();

            if (
                    song.title
                            .toLowerCase()
                            .contains(q)
                    ||
                    song.artist
                            .toLowerCase()
                            .contains(q)
                    ||
                    song.genre
                            .toLowerCase()
                            .contains(q)
            ) {

                found = true;

                addSongTo(
                        song,
                        results
                );
            }
        }

        if (!found) {

            results.addView(
                    text(
                            "No results found.",
                            15,
                            GRAY,
                            false
                    ),
                    margins(20, 10, 20, 10)
            );
        }
    }

    private void songCard(Song song) {

        addSongTo(
                song,
                content
        );
    }

    private void addSongTo(
            Song song,
            LinearLayout parent
    ) {

        LinearLayout card =
                new LinearLayout(this);

        card.setOrientation(
                LinearLayout.HORIZONTAL
        );

        card.setGravity(
                Gravity.CENTER_VERTICAL
        );

        card.setPadding(
                14,
                12,
                14,
                12
        );

        card.setBackground(
                rounded(
                        CARD,
                        18
                )
        );

        TextView artwork = text(
                "♫",
                28,
                WHITE,
                true
        );

        artwork.setGravity(
                Gravity.CENTER
        );

        artwork.setBackground(
                rounded(
                        PURPLE,
                        16
                )
        );

        card.addView(
                artwork,
                new LinearLayout.LayoutParams(
                        58,
                        58
                )
        );

        LinearLayout details =
                new LinearLayout(this);

        details.setOrientation(
                LinearLayout.VERTICAL
        );

        details.addView(
                text(
                        song.title,
                        17,
                        WHITE,
                        true
                )
        );

        details.addView(
                text(
                        song.artist +
                                " • " +
                                song.genre,
                        13,
                        GRAY,
                        false
                )
        );

        LinearLayout.LayoutParams dp =
                new LinearLayout.LayoutParams(
                        0,
                        ViewGroup.LayoutParams.WRAP_CONTENT,
                        1
                );

        dp.setMargins(
                15,
                0,
                8,
                0
        );

        card.addView(
                details,
                dp
        );

        TextView play = text(
                "▶",
                21,
                WHITE,
                true
        );

        play.setGravity(
                Gravity.CENTER
        );

        card.addView(
                play,
                new LinearLayout.LayoutParams(
                        50,
                        50
                )
        );

        View.OnClickListener listener =
                v -> playSong(song);

        card.setOnClickListener(listener);

        play.setOnClickListener(listener);

        parent.addView(
                card,
                margins(20, 0, 20, 12)
        );
    }

    private void playlist(
            String name,
            String count
    ) {

        LinearLayout item = card();

        item.addView(
                text(
                        "♫",
                        30,
                        PURPLE,
                        true
                ),
                margins(20, 15, 20, 5)
        );

        item.addView(
                text(
                        name,
                        18,
                        WHITE,
                        true
                ),
                margins(20, 0, 20, 3)
        );

        item.addView(
                text(
                        count,
                        13,
                        GRAY,
                        false
                ),
                margins(20, 0, 20, 15)
        );

        content.addView(
                item,
                margins(20, 0, 20, 12)
        );
    }

    private void addShortcut(
            LinearLayout parent,
            String icon,
            String name,
            View.OnClickListener listener
    ) {

        LinearLayout item =
                new LinearLayout(this);

        item.setOrientation(
                LinearLayout.VERTICAL
        );

        item.setGravity(
                Gravity.CENTER
        );

        item.setOnClickListener(listener);

        item.addView(
                text(
                        icon,
                        27,
                        WHITE,
                        true
                )
        );

        item.addView(
                text(
                        name,
                        12,
                        GRAY,
                        false
                )
        );

        parent.addView(
                item,
                new LinearLayout.LayoutParams(
                        0,
                        90,
                        1
                )
        );
    }

    private void header(
            String title,
            String subtitle
    ) {

        content.addView(
                text(
                        title,
                        30,
                        WHITE,
                        true
                ),
                margins(20, 15, 20, 5)
        );

        content.addView(
                text(
                        subtitle,
                        15,
                        GRAY,
                        false
                ),
                margins(20, 0, 20, 25)
        );
    }

    private void section(String title) {

        TextView view =
                text(
                        title,
                        13,
                        GRAY,
                        true
                );

        view.setLetterSpacing(0.12f);

        content.addView(
                view,
                margins(20, 10, 20, 12)
        );
    }

    private LinearLayout card() {

        LinearLayout layout =
                new LinearLayout(this);

        layout.setOrientation(
                LinearLayout.VERTICAL
        );

        layout.setBackground(
                rounded(
                        CARD,
                        20
                )
        );

        return layout;
    }

    private Button button(
            String value
    ) {

        Button button =
                new Button(this);

        button.setText(value);

        button.setTextColor(WHITE);

        button.setTextSize(13);

        button.setAllCaps(false);

        button.setTypeface(
                Typeface.DEFAULT,
                Typeface.BOLD
        );

        button.setBackground(
                rounded(
                        PURPLE,
                        30
                )
        );

        return button;
    }

    private TextView text(
            String value,
            float size,
            int color,
            boolean bold
    ) {

        TextView view =
                new TextView(this);

        view.setText(value);

        view.setTextSize(size);

        view.setTextColor(color);

        if (bold) {

            view.setTypeface(
                    Typeface.DEFAULT,
                    Typeface.BOLD
            );
        }

        return view;
    }

    private GradientDrawable rounded(
            int color,
            int radius
    ) {

        GradientDrawable drawable =
                new GradientDrawable();

        drawable.setColor(color);

        drawable.setCornerRadius(radius);

        return drawable;
    }

    private LinearLayout.LayoutParams margins(
            int left,
            int top,
            int right,
            int bottom
    ) {

        LinearLayout.LayoutParams params =
                new LinearLayout.LayoutParams(
                        ViewGroup.LayoutParams.MATCH_PARENT,
                        ViewGroup.LayoutParams.WRAP_CONTENT
                );

        params.setMargins(
                left,
                top,
                right,
                bottom
        );

        return params;
    }

    private void clearContent() {

        if (content != null) {
            content.removeAllViews();
        }
    }

    private void playSong(Song song) {

        playing = !playing;

        if (playing) {

            Toast.makeText(
                    this,
                    "Playing " + song.title,
                    Toast.LENGTH_SHORT
            ).show();

            showPlayer(song);

        } else {

            Toast.makeText(
                    this,
                    "Paused",
                    Toast.LENGTH_SHORT
            ).show();
        }
    }

    private void showPlayer(Song song) {

        if (nowPlayingTitle == null) {

            LinearLayout player =
                    new LinearLayout(this);

            player.setGravity(
                    Gravity.CENTER_VERTICAL
            );

            player.setPadding(
                    15,
                    5,
                    8,
                    5
            );

            player.setBackgroundColor(
                    Color.rgb(20, 20, 23)
            );

            LinearLayout info =
                    new LinearLayout(this);

            info.setOrientation(
                    LinearLayout.VERTICAL
            );

            nowPlayingTitle =
                    text(
                            song.title,
                            14,
                            WHITE,
                            true
                    );

            nowPlayingArtist =
                    text(
                            song.artist,
                            11,
                            GRAY,
                            false
                    );

            info.addView(
                    nowPlayingTitle
            );

            info.addView(
                    nowPlayingArtist
            );

            player.addView(
                    info,
                    new LinearLayout.LayoutParams(
                            0,
                            ViewGroup.LayoutParams.WRAP_CONTENT,
                            1
                    )
            );

            playButton =
                    new Button(this);

            playButton.setText("❚❚");

            playButton.setTextColor(WHITE);

            playButton.setTextSize(18);

            playButton.setBackgroundColor(
                    Color.TRANSPARENT
            );

            playButton.setOnClickListener(
                    v -> {

                        playing = !playing;

                        playButton.setText(
                                playing
                                        ? "❚❚"
                                        : "▶"
                        );
                    }
            );

            player.addView(
                    playButton,
                    new LinearLayout.LayoutParams(
                            55,
                            55
                    )
            );

            root.addView(
                    player,
                    root.indexOfChild(content)
            );
        }

        nowPlayingTitle.setText(
                song.title
        );

        nowPlayingArtist.setText(
                song.artist
        );

        playButton.setText("❚❚");
    }

    private static class Song {

        String title;
        String artist;
        String genre;

        Song(
                String title,
                String artist,
                String genre
        ) {

            this.title = title;
            this.artist = artist;
            this.genre = genre;
        }
    }
}
name: Build MELORA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build MELORA
        run: |
          gradle clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MELORA-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
